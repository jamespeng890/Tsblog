name = "blog-platform"
compatibility_date = "2024-01-15"

# ✅ 关键1：强制开启 Node.js 兼容模式 (解决 jsonwebtoken 报错)
compatibility_flags = ["nodejs_compat"]

# ✅ 关键2：指定静态资源目录
pages_build_output_dir = "public"

# ✅ 关键3：既然后台锁了，我们把变量直接写在这里！
# 这样部署后，Cloudflare 会自动读取，不再需要去后台折腾
[vars]
ADMIN_USERNAME = "admin"
ADMIN_PASSWORD = "123456"  # 你可以在这里改成你想要的复杂密码

# ✅ 关键4：保留正确的数据库 ID (你之前改对的那个)
[[d1_databases]]
binding = "DB"
database_name = "blog-db"
database_id = "ed3f0184-09c4-41af-8d56-ea2d5cd42e79"
