<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客登录 - Blog Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 24px 24px;
            text-align: center;
        }

        .login-header h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .login-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .login-form {
            padding: 32px 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="password"],
        input[type="email"] {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
            font-family: inherit;
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        input[type="email"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            background: #f8f9ff;
        }

        .form-actions {
            margin-top: 24px;
        }

        .btn-primary {
            width: 100%;
            padding: 12px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.6);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .form-footer {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid #e0e0e0;
            text-align: center;
        }

        .toggle-mode {
            color: #666;
            font-size: 14px;
            margin-bottom: 16px;
        }

        .toggle-mode a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .toggle-mode a:hover {
            color: #764ba2;
        }

        .form-divider {
            display: flex;
            align-items: center;
            margin: 16px 0;
            gap: 12px;
            color: #999;
            font-size: 12px;
        }

        .form-divider::before,
        .form-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e0e0e0;
        }

        .admin-toggle {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: #f5f5f7;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .admin-toggle input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .admin-toggle label {
            margin: 0;
            cursor: pointer;
            font-weight: 500;
            flex: 1;
        }

        .error-message {
            display: none;
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 16px;
            border-left: 4px solid #c33;
        }

        .error-message.show {
            display: block;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-message {
            display: none;
            background: #efe;
            color: #3c3;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 16px;
            border-left: 4px solid #3c3;
        }

        .success-message.show {
            display: block;
            animation: slideDown 0.3s ease-out;
        }

        .loading {
            display: none;
            text-align: center;
            color: #999;
            font-size: 14px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #e0e0e0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>✨ 博客系统</h1>
            <p>Semi-Static Blog Platform</p>
        </div>

        <div class="login-form">
            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>

            <!-- 登录模式 -->
            <div id="loginMode">
                <div class="admin-toggle">
                    <input type="checkbox" id="adminToggle" onchange="toggleMode()">
                    <label for="adminToggle">管理员登录</label>
                </div>

                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="username">用户名</label>
                        <input type="text" id="username" name="username" placeholder="输入用户名" required>
                    </div>

                    <div class="form-group">
                        <label for="password">密码</label>
                        <input type="password" id="password" name="password" placeholder="输入密码" required>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-primary">登录</button>
                    </div>

                    <div class="loading" id="loginLoading">
                        <span class="spinner"></span>
                        <span>登录中...</span>
                    </div>
                </form>

                <div class="form-footer">
                    <div class="toggle-mode">
                        还没有账户？<a onclick="switchToRegister()">立即注册</a>
                    </div>
                </div>
            </div>

            <!-- 注册模式 -->
            <div id="registerMode" class="hidden">
                <form id="registerForm" onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label for="regUsername">用户名</label>
                        <input type="text" id="regUsername" name="username" placeholder="创建用户名" required>
                    </div>

                    <div class="form-group">
                        <label for="regEmail">邮箱地址</label>
                        <input type="email" id="regEmail" name="email" placeholder="输入邮箱地址" required>
                    </div>

                    <div class="form-group">
                        <label for="regPassword">密码</label>
                        <input type="password" id="regPassword" name="password" placeholder="设置密码（至少6个字符）" required>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-primary">注册</button>
                    </div>

                    <div class="loading" id="registerLoading">
                        <span class="spinner"></span>
                        <span>注册中...</span>
                    </div>
                </form>

                <div class="form-footer">
                    <div class="toggle-mode">
                        已有账户？<a onclick="switchToLogin()">直接登录</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';

        function toggleMode() {
            const adminToggle = document.getElementById('adminToggle').checked;
            const loginForm = document.getElementById('loginForm');
            const label = loginForm.querySelector('label[for="username"]');

            if (adminToggle) {
                label.textContent = '管理员用户名';
            } else {
                label.textContent = '用户名';
            }
        }

        function switchToRegister() {
            document.getElementById('loginMode').classList.add('hidden');
            document.getElementById('registerMode').classList.remove('hidden');
            clearMessages();
        }

        function switchToLogin() {
            document.getElementById('registerMode').classList.add('hidden');
            document.getElementById('loginMode').classList.remove('hidden');
            clearMessages();
        }

        function clearMessages() {
            document.getElementById('errorMessage').classList.remove('show');
            document.getElementById('successMessage').classList.remove('show');
        }

        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = message;
            errorEl.classList.add('show');
            setTimeout(() => {
                errorEl.classList.remove('show');
            }, 5000);
        }

        function showSuccess(message) {
            const successEl = document.getElementById('successMessage');
            successEl.textContent = message;
            successEl.classList.add('show');
        }

        async function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const isAdmin = document.getElementById('adminToggle').checked;
            const loginLoading = document.getElementById('loginLoading');

            loginLoading.classList.add('show');

            try {
                const response = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username,
                        password,
                        isAdmin,
                    }),
                });

                const data = await response.json();

                if (!response.ok) {
                    showError(data.error || '登录失败');
                    return;
                }

                // 保存token到localStorage
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));

                showSuccess('登录成功，正在跳转...');

                // 延迟后跳转
                setTimeout(() => {
                    if (isAdmin) {
                        window.location.href = '/blog-admin';
                    } else {
                        window.location.href = '/';
                    }
                }, 1500);
            } catch (error) {
                showError('网络错误，请重试');
                console.error(error);
            } finally {
                loginLoading.classList.remove('show');
            }
        }

        async function handleRegister(event) {
            event.preventDefault();

            const username = document.getElementById('regUsername').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const registerLoading = document.getElementById('registerLoading');

            registerLoading.classList.add('show');

            try {
                const response = await fetch(`${API_BASE}/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username,
                        email,
                        password,
                    }),
                });

                const data = await response.json();

                if (!response.ok) {
                    showError(data.error || '注册失败');
                    return;
                }

                showSuccess('注册成功，请登录');

                // 自动填充用户名并切换到登录
                setTimeout(() => {
                    document.getElementById('username').value = username;
                    switchToLogin();
                }, 1500);
            } catch (error) {
                showError('网络错误，请重试');
                console.error(error);
            } finally {
                registerLoading.classList.remove('show');
            }
        }
    </script>
</body>
</html>
